schema: spec-driven

# 项目上下文 — AI 生成所有产物时都会参考
# 把全局规则、技术栈、架构信息都写在这里
context: |
  全局规则（所有产物都必须遵守）：
    1. 所有输出必须使用中文
    2. 代码改动遵循最小修改原则，不重构无关代码
    3. 不引入新的依赖，除非明确说明必要性
    4. 代码修改必须与已有代码风格保持一致
    5. 新功能需要考虑非技术用户的使用体验
    6. 这是一个开源项目，注重代码可读性

# 每种产物的专属规则
rules:
  proposal:
    - 用中文撰写
    - 必须包含"目标"和"非目标"两部分
    - 说明对现有架构的影响（列出涉及的文件/模块）
    - 保持精简，不超过 800 字

  design:
    - 用中文撰写
    - 只设计必要的变更，不引入多余抽象
    - 如涉及新文件，说明文件路径和职责
    - 如修改现有文件，列出具体修改点（函数/类级别）
    - 优先复用已有代码和工具

  tasks:
    - 用中文撰写
    - 最多 15 个任务
    - 每个任务是独立可验证的最小改动
    - 标注任务间的依赖关系
    - 避免大段重写，每次任务只改必要的文件

  spec:
    - 用中文撰写
    - 需求描述必须具体可验证，不使用模糊措辞
    - 使用 MUST/SHOULD 区分必须和可选需求
