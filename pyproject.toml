[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maa"
version = "0.1.0"
description = "Memory Archive Agent - Personal long-term digital memory infrastructure"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "markitdown[pdf]>=0.0.1",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.0.0",
    "typing_extensions>=4.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
maa = "maa.cli:main"


[tool.setuptools.packages.find]
where = ["src"]
